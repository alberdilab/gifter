name: R package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # Pin the current-R Linux lane through the ubuntu-latest migration.
          - { os: ubuntu-24.04, r: release }
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
          # DESCRIPTION supports R >= 4.1.0. An older Ubuntu image keeps that
          # release installable while the current runners exercise R release.
          - { os: ubuntu-22.04, r: '4.1' }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgbuild, any::rcmdcheck
          needs: check

      - name: Build the source tarball and check that artifact
        run: |
          tarball <- pkgbuild::build(".", dest_path = ".", manual = FALSE)
          rcmdcheck::rcmdcheck(
            path = tarball,
            args = "--no-manual",
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-${{ matrix.config.os }}-r-${{ matrix.config.r }}
          path: check
          if-no-files-found: ignore

  database-reproducibility:
    name: Database source reproducibility
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::devtools
          needs: check

      - name: Validate sources, compile separately, and compare with packaged SQLite
        run: Rscript data-raw/verify_database.R

      - name: Check README catalogue statistics
        run: Rscript data-raw/update_database_docs.R --check
